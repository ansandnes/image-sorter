[project]
name = "image_sorter"
version = "0.1.0"
description = "A tool for sorting and analyzing images"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
# Standard library only. ExifTool and GeoNames data are bundled by scripts/build_drive.py.
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]